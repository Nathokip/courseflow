services:
  db:
    image: postgres:17-alpine
    container_name: courseflow-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: courseflow
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
